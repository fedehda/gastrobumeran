<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="url(#gold)" stroke-width="6" />

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gold)" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="12 12" />

  <!-- Boomerang Symbol (Looping loyal return) -->
  <path d="M 170 120 C 260 110, 390 180, 390 280 C 390 340, 320 380, 240 370 C 180 360, 160 300, 200 270 C 240 240, 300 270, 320 290 C 330 250, 270 200, 190 200 C 150 200, 120 160, 170 120 Z" 
        fill="url(#gold)" filter="url(#glow)" />

  <!-- Burger Bun Top -->
  <path d="M 180 230 C 180 180, 332 180, 332 230 Z" fill="url(#gold)" />
  <!-- Burger Patty -->
  <rect x="175" y="240" width="162" height="24" rx="12" fill="#78350f" />
  <!-- Cheese/Sauce Slice -->
  <path d="M 185 264 L 210 278 L 245 264 L 280 280 L 327 264" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" fill="none" />
  <!-- Burger Bun Bottom -->
  <rect x="185" y="278" width="142" height="26" rx="13" fill="url(#gold)" />

  <!-- Star of Quality -->
  <polygon points="256,70 268,100 300,103 275,123 283,154 256,137 229,154 237,123 212,103 244,100" fill="url(#flame)" filter="url(#glow)" />
</svg>
